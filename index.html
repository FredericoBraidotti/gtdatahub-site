<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GT DataHub — Transforme seus dados de sim racing em vantagem real nas pistas." />
  <title>GT DataHub — Nova Era no Sim Racing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">

    <!-- ================================================
         Hero Image
         Substitua o src abaixo pela imagem da sua
         biblioteca do Copilot (ex: images/hero.jpg)
         ================================================ -->
    <div class="hero">
      <img
        src="images/hero.svg"
        alt="GT DataHub — tecnologia e velocidade no sim racing"
        class="hero-image"
        width="240"
        height="240"
      />
    </div>

    <!-- Branding -->
    <p class="logo">GT DataHub</p>

    <!-- Headline -->
    <h1 class="headline">
      Prepare-se para uma<br />
      <span>nova era</span> no sim racing.
    </h1>

    <!-- Body copy -->
    <p class="body-text">
      O GT DataHub vai transformar seus dados em vantagem real nas pistas.<br />
      Deixe seu e&#8209;mail e seja um dos primeiros a testar.
    </p>

    <!-- Email capture form (action to be wired up later) -->
    <form class="email-form" action="#" method="post">
      <input
        class="email-input"
        type="email"
        name="email"
        placeholder="seu@email.com"
        required
        autocomplete="email"
      />
      <button class="submit-btn" type="submit">Quero testar</button>
    </form>

  </main>

  <footer>
    &copy; <span id="year">2024</span> GT DataHub. Todos os direitos reservados.
  </footer>

</body>
</html>
